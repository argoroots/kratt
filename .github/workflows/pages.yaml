# Builds kratt.roots.ee: the guide page, skill.md and one ZIP per skill,
# zipped from the repo on every push so the downloads never lag behind the code.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp site/* _site/
          cp stitch-o-matic/examples/sample.png _site/
          for d in stitch-o-matic tikandikogu; do
            zip -r -q "_site/$d.zip" "$d" -x '*/.DS_Store' '*/__pycache__/*'
          done
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4